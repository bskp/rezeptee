<head>
    <title>Rezept.ee</title>
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Das apple-Präfix ist deprecated, ältere iOS-Versionen brauchen es aber noch. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rezept.ee">
    <!-- Nicht black-translucent: Damit blendet WebKit den iOS-27-Blur trotz
         #statusbar (rezepte.less) nicht aus. iOS liest den Tag vermutlich nur
         beim Hinzufügen zum Home-Bildschirm, also mit neuer PWA testen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#9D643C">
    <!-- viewport-fit=cover schaltet env(safe-area-inset-*) überhaupt erst
         scharf; ohne das liefern sie konstant 0. Siehe :root in rezepte.less. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <!-- Absolute Pfade: relativ würden sie auf /rezept/foo zu /rezept/buch-180.png
         auflösen, wo Meteor die SPA statt des Bildes ausliefert. -->
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/buch-180.png">
    <link rel="apple-touch-icon" type="image/png" sizes="512x512" href="/buch-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
</head>

<body>
<!-- Opake Statusleiste für die iOS-PWA, siehe #statusbar in rezepte.less. -->
<div id="statusbar"></div>
<div id="react-target"></div>
</body>
