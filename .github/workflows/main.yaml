# Credits to https://github.com/renanlecaro

name: Main
on:
  # Bewusst ohne branches-Filter: sonst laufen die Checks nur bei PRs gegen
  # main, und gestapelte PRs (Base = ein anderer Branch) bekämen gar keine CI.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Install app dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  build_and_deploy:
    # Deployt erst, wenn checks durch sind — vorher lief ein Push auf main
    # ungetestet ins Prod.
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          name: id_rsa_github_actor

      # Test SSH connectivity (fail fast)
      - name: Test ssh key to fail fast
        run: ssh ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} -i ~/.ssh/id_rsa_github_actor -t "pwd"

      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Get dependencies
        run: cd ./app && npm ci

      - name: (Hack) Remove malformed package
        run: find ./app/node_modules -name malformed_package_json -type d -prune -exec rm -rf "{}" \;

      - name: Install mup locally
        run: npm install mup

      - name: Install meteor
        run: curl https://install.meteor.com/ | sh

      - name: Bundle the app and upload to Hoster
        run: npx mup deploy
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
